name: CI and release builds

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # AWS-LC can use bundled assembly objects on Windows runners without NASM.
  AWS_LC_SYS_PREBUILT_NASM: '1'

jobs:
  test:
    name: Test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: &platforms
        include:
          - platform: windows-x64
            runner: windows-2025
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo test --workspace --all-features --locked

  assemble:
    name: Assemble (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: *platforms
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo build --release --locked --workspace --bins
      - name: Package executables
        shell: bash
        env:
          PACKAGE: atc-trainer-${{ matrix.platform }}
          EXE: ${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          mkdir -p "$PACKAGE/docs"
          cp "target/release/atc-client$EXE" "target/release/atc-server$EXE" server.toml "$PACKAGE/"
          cp docs/scenario-gnd-36-medium.toml "$PACKAGE/docs/"
          # A tar archive preserves the macOS executable bits on download.
          tar -czf "$PACKAGE.tar.gz" "$PACKAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: atc-trainer-${{ matrix.platform }}.tar.gz
          archive: false
          if-no-files-found: error
